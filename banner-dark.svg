  <text x="35" y="72" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="3.2" fill="#9198a1">AGENT INFRASTRUCTURE</text>
  <line x1="32" y1="90" x2="688" y2="90" stroke="#3d444d" stroke-width="1"/>

