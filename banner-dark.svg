<svg xmlns="http://www.w3.org/2000/svg" width="720" height="316" viewBox="0 0 720 316" role="img" aria-label="Iwan Braun, agent infrastructure. A blueprint: two Claude Code plugins, ultraweb (design studio, 80 skills, 7 gates) and hardmode (discipline floor, hooks, verification), seated on Claude Code, shipping ultraweb-site with 7 of 7 gates green.">
